[package]
name = "gateway-sessions"
version = "0.1.0"
edition = "2024"
description = "Broker session protocol and lease lifecycle for JSON-RPC gateways"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
