[package]
name = "gateway-iot"
version = "0.1.0"
edition = "2024"
description = "Gateway-owned IoT server transports and broker runtime"

[features]
default = ["mqtt", "coap", "amqp"]
mqtt = ["dep:rumqttc", "dep:rustls"]
coap = []
amqp = ["dep:lapin", "dep:futures-util"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", optional = true }
gateway-sessions.workspace = true
json-rpc-2-core.workspace = true
json-rpc-2-transport.workspace = true
lapin = { version = "4.12", optional = true, default-features = false, features = ["tokio", "rustls--ring", "rustls-native-certs"] }
rumqttc = { version = "0.25", optional = true, default-features = false, features = ["use-rustls-no-provider", "url"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
